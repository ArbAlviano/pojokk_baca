<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pojok Baca - Beranda</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/nav.css">
    <script>
        window.API_URL = window.API_URL || 'https://pojokkbaca-production.up.railway.app';
    </script>
    <script src="js/cover.js"></script>
</head>
<body>

    <!-- NAVBAR / BAGIAN ATAS -->
        <header>
            <div class="logo">Pojok Baca</div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <div id="navRoot"></div>
            </div>
        </header>

        <!-- SEARCH BAR -->
        <div class="search-bar" id="searchBar" hidden>
            <input type="text" id="searchInput" placeholder="Cari judul atau penulis buku..." autocomplete="off">
        </div>


    <!-- KONTEN UTAMA -->
    <main class="container">
        
        <!-- FILTER GENRE -->
        <section class="filter-section">
            <h3>Filter Genre:</h3>
            <div class="filter-buttons">
                <button class="btn-filter active" onclick="loadBooks('')">Semua</button>
                <button class="btn-filter" onclick="loadBooks('Novel')">Novel</button>
                <button class="btn-filter" onclick="loadBooks('Komik')">Komik</button>
                <button class="btn-filter" onclick="loadBooks('Edukasi')">Edukasi</button>
            </div>
        </section>

        <!-- KATALOG BUKU -->
        <section class="catalog-section">
            <h2>Katalog Buku Terkini</h2>
            <div id="bookList" class="book-grid">
                <!-- Data buku akan disuntikkan secara otomatis oleh JavaScript di sini -->
            </div>
            <div class="pagination" id="pagination"></div>
        </section>

        <!-- letakkan ini di dalam tag <main> di index.html -->
<!-- SECTION RIWAYAT BACA -->
        <section class="history-section" id="historySection" style="margin-bottom: 40px; display: none;">
            <h2 class="history-title">Lanjut Membaca</h2>
            <div id="historyList" class="book-grid">
                <!-- Buku riwayat akan muncul disini -->
            </div>
        </section>


    </main>

    <script src="js/home.js"></script>
    <script src="js/nav.js"></script>
</body>
</html>
