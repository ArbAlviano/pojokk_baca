<!-- bookmark.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pojok Baca - Bookmark Saya</title>
    <!-- Kita gunakan kembali CSS home karena struktur layout katalognya sama -->
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/bookmark.css">
    <script src="js/theme.js"></script>
</head>
<body>

    <header>
        <div class="logo" onclick="window.location.href='index.html'" style="cursor:pointer;">📚 Kembali ke Beranda</div>
        <div class="user-menu" style="display: flex; gap: 15px; align-items: center;">
            <span id="welcomeText">Koleksi Favorit</span>
            <button class="theme-toggle" aria-label="Ganti tema terang/gelap"></button>
        </div>
    </header>

    <main class="container">
        <section class="catalog-section">
            <h2>Buku yang Anda Tandai</h2>
            <div id="bookmarkList" class="book-grid">
                <!-- Buku favorit akan disuntikkan secara otomatis oleh JavaScript di sini -->
            </div>
        </section>
    </main>

    <script src="js/bookmark.js"></script>
</body>
</html>
