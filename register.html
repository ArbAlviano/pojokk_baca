<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pojok Baca - Daftar Akun</title>
    <!-- Memanggil File CSS Terpisah -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/auth.css">
    <script>
        window.API_URL = window.API_URL || 'https://pojokkbaca-production.up.railway.app';
    </script>
</head>
<body>

<div class="container">
    <h2>Daftar Akun</h2>
    <form id="registerForm">
        <input type="text" id="username" placeholder="Masukkan Username" required>
        <input type="password" id="password" placeholder="Masukkan Password" required>
        <button type="submit">Daftar Sekarang</button>
    </form>
    <div class="link">Sudah punya akun? <a href="login.html">Login disini</a></div>
</div>

<!-- Memanggil File JavaScript Terpisah -->
<script src="js/register.js"></script>
</body>
</html>
